# cargo deny check for the GUI workspace (libs/kit/, app/; tools/gate.sh runs it in libs/kit/). Licences,
# advisories and sources as strict as core's deny.toml; duplicate versions only warn: the GUI
# stack (wgpu, winit, windows-*, objc2) carries many we cannot pick.

[graph]
all-features = false

[advisories]
yanked = "deny"
# unmaintained, no maintained replacement upstream of us yet; revisit on a stack upgrade
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 (unmaintained): compile-time only, via hax-lib-macros 0.3 under libcrux-ml-kem; no runtime code" },
    { id = "RUSTSEC-2024-0436", reason = "paste: compile-time macro, via metal under wgpu-hal (macOS backend)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: winit's sctk-adwaita (Wayland window decorations) via ab_glyph" },
]

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    # Boost: permissive, no attribution in binaries (Tess: fine for any crate)
    "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
