[package]
name = "osis-kit"
description = "The first-party UI toolkit over Masonry: windowing, the osis-Masonry driver, widgets, theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
test = false
doctest = false

[lints]
workspace = true

[features]
# Screen reader support (AccessKit's platform adapter; on Linux zbus and ~55 crates). Off: no
# assistive technology sees the app.
accessibility = ["masonry_winit/accessibility"]

[dependencies]
osis.workspace = true
jiff.workspace = true
tokio.workspace = true
masonry.workspace = true
masonry_winit.workspace = true
# Feature pin, unused here (notes/build.md, Feature unification): as core's proptest enables it.
regex-syntax.workspace = true

[build-dependencies]
osis-schema.workspace = true

