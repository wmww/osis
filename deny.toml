# cargo deny check (notes/testing.md, Policy checks): licences, duplicate versions, advisories,
# sources. Covers the workspace; fuzz/ is outside it.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# A duplicate that cannot be avoided gets a `skip` entry with a reason.
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
