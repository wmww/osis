# cargo deny check (notes/testing.md, Policy checks): licences, duplicate versions, advisories,
# sources. Covers the workspace; fuzz/ is outside it.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained): compile-time macro via netlink-packet-core under iroh's netwatch (osis-transport feature iroh)" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 (unmaintained): compile-time only, via hax-lib-macros 0.3 under libcrux-ml-kem; no runtime code" },
]

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
]
# Feature `iroh` of osis-transport only (notes/architecture.md §5).
exceptions = [
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    { crate = "ws_stream_wasm", allow = ["Unlicense"] },
    { crate = "pharos", allow = ["Unlicense"] },
    { crate = "async_io_stream", allow = ["Unlicense"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# A duplicate that cannot be avoided gets a `skip` entry with a reason.
skip-tree = [
    { crate = "iroh@1.3.0", reason = "osis-transport feature iroh only (off by default): its RustCrypto 0.11/dalek 3 generation, netlink, jni and windows lines duplicate ours and each other" },
]
skip = [
    { crate = "chacha20@0.10.2", reason = "proptest (dev) and libcrux-traits' unused rand 0.10; crypto uses 0.9 via chacha20poly1305" },
    { crate = "rand_core@0.10.1", reason = "libcrux-traits' unused rand 0.10 and proptest's chacha20 0.10; dalek 2.x needs 0.6" },
    { crate = "cpufeatures@0.3.1", reason = "blake3 1.8 and chacha20 0.10; dalek and poly1305 still on 0.2" },
    { crate = "getrandom@0.4.3", reason = "uuid in hax-lib-macros-types (libcrux build-time macros); rand_core 0.6 uses 0.2" },
    { crate = "hax-lib@0.3.7", reason = "libcrux-ml-kem 0.0.11 pulls hax-lib 0.3 (core-models) and 0.4" },
    { crate = "hax-lib-macros@0.3.7", reason = "as hax-lib 0.3" },
    { crate = "hax-lib-macros-types@0.3.7", reason = "as hax-lib 0.3" },
    { crate = "shlex@1.3.0", reason = "bindgen, a build dep of crabgrind under libcrux-secrets; cc uses 2.0" },
    { crate = "syn@3.0.9", reason = "serde_derive in hax-lib-macros-types (libcrux build-time macros); everything else on syn 2" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 (osis-transport feature quic, Windows only); quinn-udp, socket2 and tokio on 0.61" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
