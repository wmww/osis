# cargo deny check (notes/testing.md, Policy checks): licences, duplicate versions, advisories,
# sources. Covers the workspace; core/test/fuzz/ is outside it.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 (unmaintained): compile-time only, via hax-lib-macros 0.3 under libcrux-ml-kem; no runtime code" },
]

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# A duplicate that cannot be avoided gets a `skip` entry with a reason.
skip = [
    { crate = "chacha20@0.10.2", reason = "proptest (dev) and libcrux-traits' unused rand 0.10; crypto uses 0.9 via chacha20poly1305" },
    { crate = "rand_core@0.10.1", reason = "libcrux-traits' unused rand 0.10 and proptest's chacha20 0.10; dalek 2.x needs 0.6" },
    { crate = "hax-lib@0.3.7", reason = "libcrux-ml-kem 0.0.11 pulls hax-lib 0.3 (core-models) and 0.4" },
    { crate = "hax-lib-macros@0.3.7", reason = "as hax-lib 0.3" },
    { crate = "hax-lib-macros-types@0.3.7", reason = "as hax-lib 0.3" },
    { crate = "cpufeatures@0.2.17", reason = "the dalek 2/RustCrypto 0.10 generation (curve25519, sha2, chacha20, poly1305); blake3 1.8 uses 0.3" },
    { crate = "getrandom@0.2.17", reason = "rand_core 0.6 (dalek 2.x) and ring; uuid under hax-lib-macros-types 0.3 uses 0.4" },
    { crate = "shlex@1.3.0", reason = "bindgen (build only); cc uses 2.x" },
    { crate = "syn@2.0.119", reason = "proc macros (dalek, hax-lib, bindgen); clap_derive uses 3.x; compile time only" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 (Windows only); mio/tokio use 0.61" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
