# cargo deny check (notes/testing.md, Policy checks): licences, duplicate versions, advisories,
# sources. Covers the workspace, the GUI included; core/test/fuzz/ is outside it.

# Default features: the GUI's off-by-default `accessibility` (zbus, unmaintained parts) is not
# checked; core has no other optional features.
[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 (unmaintained): compile-time only, via hax-lib-macros 0.3 under libcrux-ml-kem; no runtime code" },
    # GUI: unmaintained, no maintained replacement upstream of us yet; revisit on a stack upgrade
    { id = "RUSTSEC-2024-0436", reason = "paste: compile-time macro, via metal under wgpu-hal (macOS backend)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: winit's sctk-adwaita (Wayland window decorations) via ab_glyph" },
]

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    # Boost: permissive, no attribution in binaries (Tess: fine for any crate)
    "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# A duplicate that cannot be avoided gets a `skip` entry with a reason.
skip = [
    { crate = "chacha20@0.10.2", reason = "proptest (dev) and libcrux-traits' unused rand 0.10; crypto uses 0.9 via chacha20poly1305" },
    { crate = "rand_core@0.10.1", reason = "libcrux-traits' unused rand 0.10 and proptest's chacha20 0.10; dalek 2.x needs 0.6" },
    { crate = "hax-lib@0.3.7", reason = "libcrux-ml-kem 0.0.11 pulls hax-lib 0.3 (core-models) and 0.4" },
    { crate = "hax-lib-macros@0.3.7", reason = "as hax-lib 0.3" },
    { crate = "hax-lib-macros-types@0.3.7", reason = "as hax-lib 0.3" },
    { crate = "cpufeatures@0.2.17", reason = "the dalek 2/RustCrypto 0.10 generation (curve25519, sha2, chacha20, poly1305); blake3 1.8 uses 0.3" },
    { crate = "getrandom@0.2.17", reason = "rand_core 0.6 (dalek 2.x) and ring; quinn-proto, rand 0.10 and uuid use 0.4" },
    { crate = "shlex@1.3.0", reason = "bindgen (build only); cc uses 2.x" },
    { crate = "syn@2.0.119", reason = "proc macros (dalek, hax-lib, bindgen); serde_derive, tokio-macros, clap_derive and others use 3.x; compile time only" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 (Windows only); mio/tokio use 0.61" },
]
# The GUI stack (wgpu, winit, windows-*, objc2) carries many duplicates we cannot pick: its trees
# are left out of duplicate detection (a core duplicate still fails, unless the GUI stack holds a copy).
skip-tree = [
    { crate = "masonry@0.4.0", reason = "the GUI stack: Vello, wgpu, Parley, AccessKit" },
    { crate = "masonry_winit@0.4.0", reason = "the GUI stack: winit and its platform crates" },
    { crate = "winit", reason = "osis-android's own (Android target)" },
    { crate = "jni", reason = "osis-android's clipboard (Android target)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
