\* Safety: 2 admins, 1 reader a1 may remove, 2 rotations, one content write,
\* claim sets kept, nobody offline, log order kept.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"m1"}
  Remover = "a1"
  Departing = {"m1"}
  MaxE = 2
  Writes = 1
  DropClaims = FALSE
  Offs = 0
  InOrder = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked
CHECK_DEADLOCK FALSE
