  Admins = {"a1", "a2"}
  Readers = {"m1"}
  Late = {}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 1
  DropClaims = FALSE
  Refresh = FALSE
  HistApplied = TRUE
  Offs = 0
  InOrder = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK
PROPERTIES CurrentOpens ReadsAll
CHECK_DEADLOCK FALSE
