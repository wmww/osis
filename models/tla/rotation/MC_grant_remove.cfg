\* Re-seal next to a removal: reader m2 granted later (a grant raced by a
\* rotation is re-sealed) while a1 removes m1; 2 rotations, no writes, log
\* order. The other safety instances never enable a re-seal.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"m1", "m2"}
  Late = {"m2"}
  Remover = "a1"
  Departing = {"m1"}
  MaxE = 2
  Writes = 0
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  InOrder = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DepartedLocked
CHECK_DEADLOCK FALSE
