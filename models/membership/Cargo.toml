[package]
name = "membership-model"
description = "Throwaway model of the membership rules (spec/permissions.md §5-§6). Not the implementation."
version = "0.0.0"
edition = "2021"
publish = false

[lib]
doctest = false

[[bin]]
name = "membership-model"
test = false

# Reference model: style lints off; correctness is checked by its tests.
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = { level = "allow", priority = -1 }
