# Per-commit tier (notes/testing.md): build, tier-1 tests (vectors included), clippy, deny, policy.
# Nothing here needs nextest, nightly or cargo-fuzz. Slow tiers: nightly.yml.
name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --all-targets --locked
      - name: test (tier 1, PROPTEST_CASES=32 from .cargo/config.toml)
        run: cargo test --workspace --locked
      - name: vectors (also part of tier 1; listed for visibility)
        run: cargo test -p osis-vectors --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unsafe, lints, dependency allowlist
        run: python3 tools/policy.py
      - name: every test cites a spec section
        run: python3 tools/spec_map.py --uncited
      - name: every MUST has a test or an issue
        run: python3 tools/spec_map.py --gaps

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: licences, duplicates, advisories, sources
        run: cargo deny check
