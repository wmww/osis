# cargo-fuzz targets (fuzz/README.md). Outside the workspace: needs nightly and libFuzzer.
[package]
name = "osis-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
osis-core = { path = "../crates/osis-core" }
osis-schema = { path = "../crates/osis-schema" }
osis-commit = { path = "../crates/osis-commit" }
osis-crypto = { path = "../crates/osis-crypto" }
osis-label = { path = "../crates/osis-label" }
osis-proto = { path = "../crates/osis-proto" }
osis-crdt = { path = "../crates/osis-crdt" }

[profile.release]
debug = 1

[[bin]]
name = "cbor_decode"
path = "fuzz_targets/cbor_decode.rs"
test = false
doc = false
bench = false

