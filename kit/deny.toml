# cargo deny check for the GUI workspace (kit/, app/; tools/gate.sh runs it in kit/). Licences,
# advisories and sources as strict as core's deny.toml; duplicate versions only warn: the GUI
# stack (wgpu, winit, windows-*, objc2) carries many we cannot pick.

[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = []

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
