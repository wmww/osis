[package]
name = "osis-app"
description = "The first-party osis app (prototype: a notes app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
test = false
doctest = false

[lints]
workspace = true

[[bin]]
name = "osis-app"
test = false
path = "src/main.rs"

[features]
# osis-kit's `accessibility` (screen readers); off by default.
accessibility = ["osis-kit/accessibility"]

[dependencies]
osis.workspace = true
osis-chat.workspace = true
osis-kit.workspace = true
jiff.workspace = true
tokio.workspace = true

[build-dependencies]
osis-schema.workspace = true
