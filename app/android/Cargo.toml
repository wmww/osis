[package]
name = "osis-android"
description = "The osis app on Android (experimental; notes/android.md): its View and Activity (java/) and the Rust shell behind them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# build.sh packs the cdylib with java/'s classes; on other targets the lib is empty.
crate-type = ["cdylib"]
test = false
doctest = false

# The workspace's lints, with unsafe_code at deny instead of forbid: the view's Surface becomes a
# native window through one unsafe call, allowed on that item.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[target.'cfg(target_os = "android")'.dependencies]
osis.workspace = true
osis-app.workspace = true
osis-kit.workspace = true
# JNI both ways: java/'s natives (native_method!) and calls into the view
jni = "0.22"
# the view's Surface as a native window, a wgpu surface target (rwh_06)
ndk = { version = "0.9", features = ["rwh_06"] }
pollster = "0.4"
log = "0.4"
# a logcat subscriber, set first: masonry's default writes stderr (lost on Android) and a log
# file in temp_dir (not writable there)
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
android_logger = "0.15"
