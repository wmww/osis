[package]
name = "osis-server"
description = "Blind node used as a server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
osis-base.workspace = true
osis-crypto.workspace = true
osis-label.workspace = true
osis-proto.workspace = true
osis-store.workspace = true
osis-transport.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[features]
default = ["driver"]
# The async driver and network adapter (tokio); off, the crate is the sans-I/O store and hub.
driver = ["dep:tokio"]

[[bin]]
name = "osis-server"
test = false
required-features = ["driver"]
