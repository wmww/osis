[package]
name = "osis-node"
description = "The node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
osis-engine.workspace = true
osis-base.workspace = true
osis-crypto.workspace = true
osis-crdt.workspace = true
osis-schema.workspace = true
osis-commit.workspace = true
osis-perm.workspace = true
osis-keys.workspace = true
osis-label.workspace = true
osis-store.workspace = true
osis-proto.workspace = true
osis-transport.workspace = true
osis-host.workspace = true
tokio = { workspace = true, optional = true }

[features]
default = ["driver"]
# The tokio driver over osis-transport sessions; off, the crate is the sans-I/O engine.
driver = ["dep:tokio"]
# The driver's LAN loop (UDP announcements, spec/sync.md §10).

[dev-dependencies]
# Judgment vectors (tests/it/judgment.rs): the `.vec` format and the vectors directory.
osis-vectors.workspace = true
# The held-model adapter (tests/it/held.rs): an independent reading of the spec to compare with.
held-model.workspace = true
