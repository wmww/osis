[package]
name = "osis"
description = "A decentralized, reactive data layer for interconnected applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
test = false

[lints]
workspace = true

[features]
# Co-readers over iroh beside QUIC hosts (`Transport::Quic`; spec/sync.md §5, §10).
iroh = ["osis-transport/iroh", "osis-node/iroh"]
# The LAN loop: per-network keys and announcements (spec/sync.md §10).
lan = ["iroh", "osis-node/lan"]

[dependencies]
osis-node.workspace = true
osis-base.workspace = true
osis-crdt.workspace = true
osis-schema.workspace = true
osis-commit.workspace = true
osis-label.workspace = true
osis-store.workspace = true
osis-crypto.workspace = true
osis-transport.workspace = true
osis-proto.workspace = true
tokio.workspace = true

[build-dependencies]
osis-schema.workspace = true

[dev-dependencies]
osis-sim.workspace = true
osis-host.workspace = true
