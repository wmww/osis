[package]
name = "osis-transport"
description = "Transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
osis-base.workspace = true
zeroize.workspace = true
# InProcess keys are Ed25519 like every transport's (a dialable key verifies LAN announcements).
ed25519-dalek.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
tokio.workspace = true
# An IPv6-only LAN socket beside the IPv4 one (already in tokio's tree).
socket2 = "0.6"

[features]
# LAN announcements over UDP, IPv4 and IPv6 (spec/sync.md §10).

