\* negative control: a claim bound to an older epoch counts: the removed Adv opens by its old claim (Safe)
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- RKM
  Role <- RoleRK
  Adv = "m"
  InitMembers <- MemRK
  Events <- EvRK
  MaxConn = 2
  SideByte = TRUE
  AnswerSig = TRUE
  ProofSecret = TRUE
  OlderEnds = TRUE
  HeadEnds = TRUE
  ClaimOld = TRUE
  DepositOpens = FALSE
  Claims = TRUE
  DialProves = FALSE
  AdvPublic = TRUE
  AdvJunk = FALSE
  LostTag = TRUE
  Declared = TRUE
INVARIANT Safe
