  Entries <- Es2
  Ls <- Ls1
  EL <- EL1
  Author <- AuA
  Stores <- STORES2
  Dials <- DialsOne
  PageK = 1
  MaxRestart = 0
  MaxRecLoss = 0
  MaxDelete = 0
  MaxExpire = 0
  MaxClone = 0
  MaxDrop = 0
  MaxRevoke = 0
  Retire = FALSE
  IncCheck = TRUE
  KeepHistory = TRUE
  ListingDels = TRUE
  Infer = "none"
  JoinDurable = TRUE
  JoinAnswer = TRUE
  LostOlder = TRUE
  CursorOnApply = TRUE
  ServerGate = TRUE
  BothPull = TRUE
  SReconcile = TRUE
  Rearm = TRUE
  Trim = TRUE
  TrackPres = TRUE
  PresReplace = "whole"
  ServeHalf = "apply"
  Echo = "window"
INVARIANTS NoWriteLost CaughtUpHolds ServedRight ReconnectCost CaughtUpServed PresenceSound PresenceComplete
