  HeadEnds = TRUE
  ClaimOld = FALSE
  DepositOpens = FALSE
  Claims = TRUE
  DialProves = FALSE
  AdvPublic = TRUE
  AdvJunk = FALSE
  LostTag = TRUE
  Declared = TRUE
INVARIANT Safe
