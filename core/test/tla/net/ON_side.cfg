\* control: no side byte; Adv reflects a store's own open signature as its answer
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- RKM
  Role <- RoleRK
  Adv = "m"
  AdvLink = FALSE
  InitMembers <- MemRK
  Events <- EvRK
  MaxConn = 2
  SideByte = FALSE
  AnswerSig = TRUE
  ListenerSigns = TRUE
  ProofSecret = TRUE
  NewestOnly = TRUE
  ProofNewest = TRUE
  LinkNewest = TRUE
  JNow = TRUE
  Rejudge <- AllRejudge
  Departed = TRUE
  DialProves = FALSE
INVARIANT Safe
