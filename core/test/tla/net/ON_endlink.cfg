\* control: an open by static entry is not re-judged; the reader's open toward Adv's link outlives its removal
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- RXM
  Role <- RoleRX
  Adv = "m"
  AdvLink = TRUE
  InitMembers <- MemRX
  Events <- EvRm
  MaxConn = 2
  SideByte = TRUE
  AnswerSig = TRUE
  ListenerSigns = TRUE
  ProofSecret = TRUE
  NewestOnly = TRUE
  ProofNewest = TRUE
  LinkNewest = TRUE
  JNow = TRUE
  Rejudge = {"J","sync","proof"}
  Departed = TRUE
  DialProves = FALSE
  AdvPublic = TRUE
  AdvJunk = FALSE
  LostTag = TRUE
  Walked = TRUE
INVARIANT Safe
