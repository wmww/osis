CONSTANTS
  MaxEp = 3
  Regrant = TRUE
  NoHead = FALSE
  Inflate = FALSE
  KeepCopy = FALSE
  ShowAll = FALSE
  ShowNone = FALSE
  TakeAny = FALSE
  DropPath = TRUE
INVARIANTS OnlyBoxedContent RemovedHoldsNothing RemovedClosed FewStops Refetches
