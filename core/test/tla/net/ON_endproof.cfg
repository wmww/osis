\* control: an open by proof is not re-judged; a store's open toward Adv by its step-0 proof outlives the rotation (Safe)
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- RKM
  Role <- RoleRK
  Adv = "m"
  AdvLink = FALSE
  InitMembers <- MemRK
  Events <- EvRK
  MaxConn = 2
  SideByte = TRUE
  AnswerSig = TRUE
  ListenerSigns = TRUE
  ProofSecret = TRUE
  NewestOnly = TRUE
  ProofNewest = TRUE
  LinkNewest = TRUE
  JNow = TRUE
  Rejudge = {"J","sync","link"}
  Departed = TRUE
  DialProves = FALSE
  AdvPublic = TRUE
  AdvJunk = FALSE
  LostTag = TRUE
  ShownKey = TRUE
INVARIANT Safe
