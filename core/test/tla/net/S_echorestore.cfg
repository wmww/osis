  JoinDurable = TRUE
  JoinAnswer = TRUE
  LostOlder = TRUE
  CursorOnApply = TRUE
  ServerGate = TRUE
  BothPull = TRUE
  SReconcile = TRUE
  Rearm = TRUE
  Trim = TRUE
  TrackPres = TRUE
  PresReplace = "whole"
  ServeHalf = "apply"
