\* no echo, b restored from a backup taken at any instant (its record kept): each Applied carries the requester's log end (the anchor) and the next Pull to it names the held one, a server answering from the start when its history lacks it; the held anchor is replaced only once a reply on the connection checked it; PresenceSound, CaughtUpServed: pass
