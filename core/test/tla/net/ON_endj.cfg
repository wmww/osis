\* control: an open by J is not re-judged; the reader's J open toward Adv outlives its removal
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- RKM
  Role <- RoleRK
  Adv = "m"
  AdvLink = FALSE
  InitMembers <- MemRK
  Events <- EvRK
  MaxConn = 2
  SideByte = TRUE
  AnswerSig = TRUE
  ListenerSigns = TRUE
  ProofSecret = TRUE
  NewestOnly = TRUE
  ProofNewest = TRUE
  LinkNewest = TRUE
  JNow = TRUE
  Rejudge = {"sync","proof","link"}
  Departed = TRUE
  DialProves = FALSE
INVARIANT Safe
