  MaxEp = 3
  DropOnHead = FALSE
  OpenAny = FALSE
  SigRule = "held"
  Regrant = TRUE
  BindEpoch = TRUE
  NoHead = TRUE
  RejudgeBox = FALSE
  NoHeldAny = FALSE
  Inflate = FALSE
INVARIANTS NoDropOnHeadMove RemovedStops StrandedOnlyWaiting RemovedDrops
