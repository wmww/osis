\* negative control: past its keys K shows nothing, a re-grant after a further rotation never re-fetches (Refetches fails)
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxEp = 3
  Regrant = TRUE
  NoHead = FALSE
  FakeBox = FALSE
  KeepCopy = FALSE
  ShowAll = FALSE
  ShowNone = TRUE
  TakeAny = FALSE
  DropPath = FALSE
INVARIANTS OnlyBoxedContent RemovedHoldsNothing RemovedClosed FewStops Refetches
