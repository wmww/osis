\* the spec's rule (the fix of KF_late and KF_regrant): a removal signature verifies under the delete key of a step from the newest whose sync secret K holds to the head, and binds an epoch at or past every one K holds; with re-grants, a removed K drops S, a forged or stale notice drops nothing: pass
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxEp = 3
  DropOnHead = FALSE
  OpenAny = FALSE
  SigRule = "held"
  Regrant = TRUE
  BindEpoch = TRUE
INVARIANTS NoDropOnHeadMove RemovedStops StrandedOnlyWaiting RemovedDrops
