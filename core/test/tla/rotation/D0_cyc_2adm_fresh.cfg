  ActSeq <- cActs
  Mem <- cyMem
  Adm <- cyAdm
  Learners <- cyLearners
  Deps <- cDeps
  Eager <- cyEager
  Forgers = {}
  WriteTo = {"X", "Y"}
  Writes = 2
  MaxE = 7
  LeaveOut = "fresh"
  CycleCheck = "fresh"
  Stale = "listed"
  Anchor = TRUE
  Merge = TRUE
  Rejoin = FALSE
  Carry = TRUE
SPECIFICATION Spec
INVARIANTS NoLeakDirect NoLeakMemberAll
PROPERTIES Excludes CurrentOpens ReadsAll Settles
CHECK_DEADLOCK FALSE
