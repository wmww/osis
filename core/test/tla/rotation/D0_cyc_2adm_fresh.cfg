\* 2-cycle X <-> Y with a second admin y2 of Y, under the failed Fresh candidate (fails NoLeakDirect: y2 re-seals Y to X's new keyset, x1 re-seals X into Y on that box, y1, not yet knowing, re-seals Y to X's old one).
CONSTANTS
  ActSeq <- cActs
  Mem <- cyMem
  Adm <- cyAdm
  Learners <- cyLearners
  Deps <- cDeps
  Eager <- cyEager
  Forgers = {}
  WriteTo = {"X", "Y"}
  Writes = 2
  MaxE = 7
  Fresh = TRUE
  Grants <- noGrants
  Hidden = {}
  Taint = FALSE
  MaxBlind = 0
  Via = {}
  NoSync = {}
  Split = FALSE
  Rule = "spec"
SPECIFICATION Spec
INVARIANTS NoLeakDirect NoLeakMemberAll
PROPERTIES Excludes CurrentOpens ReadsAll Settles
CHECK_DEADLOCK FALSE
