\* Negative control: keyset names met only by the commit that wrote the named
\* keyset, no names of departures from the group: a1 names keyset 2 (a later
\* rotation of g, not R_P); a2 holds it, and d's keyset 3, valid at a2, is
\* newer (expected failure: DevLocked).
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 0
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = FALSE
  KeysetBy = "commit"
  GActs = {"rot", "forge"}
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked DevLocked
CHECK_DEADLOCK FALSE
