\* As MC_c3_proj, and a second edge write of g naming a keyset nobody holds
\* reaches a2 (BadEdge): a2, bound to it, leaves g out until a1's free box
\* (a re-seal or rotation carrying names) reaches it. Safety as MC_c3_proj
\* (liveness would need MaxE 2: a1 must rotate before re-sealing g).
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {"g"}
  Remover = "a1"
  Departing = {}
  MaxE = 1
  Writes = 0
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = TRUE
  KeysetBy = "epoch"
  Frozen = TRUE
  Split = TRUE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "grant"
  Proj = "bound"
  GActs = {"badedge"}
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DevGranted
CHECK_DEADLOCK FALSE
