\* Negative control: the stamp rule (the step's read key while the read field's stamp is no later than the step's): a step concurrent with the knowing rotation keeps an epoch R holds in force (fails NoLeakStrict, finding F1).
CONSTANTS
  Rule = "stamps"
  Parts = FALSE
  ReadOnly = FALSE
  HMax = 1
  W2Max = 1
  MaxTs = 2
  OptSteps = 1
SPECIFICATION Spec
INVARIANTS NoLeakStrict
CHECK_DEADLOCK FALSE
