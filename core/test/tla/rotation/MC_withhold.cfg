\* As MC_fork_reorder in log order, with the host withholding the removal
\* (e2) from a2 forever (its log skips it): a2 reads a1's merge e3 (wrapped under its own e1),
\* which names e2; e3 is never established at a2, so a2 never re-seals m1 at
\* it (crypto §4 names).
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"m1"}
  Late = {}
  Remover = "a1"
  Departing = {"m1"}
  MaxE = 3
  Writes = 1
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked
CHECK_DEADLOCK FALSE
