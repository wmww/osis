\* Grants after epoch 0: 2 admins, reader m2 granted later (at
\* epoch 0 racing a rotation that misses it, or at epoch 1 needing the history
\* box for content under epoch 0: R3); 1 rotation, 1 write, no removal.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"m2"}
  Late = {"m2"}
  Remover = "a1"
  Departing = {}
  MaxE = 1
  Writes = 1
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked
PROPERTIES CurrentOpens ReadsAll
CHECK_DEADLOCK FALSE
