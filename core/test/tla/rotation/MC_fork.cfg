\* Forks: 2 admins, 1 reader, no removal, 2 rotations (so two
\* concurrent rotations fork), one content write.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"m1"}
  Late = {}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 1
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Withhold = {}
  NoBoxCovers = FALSE
  GrantEntries = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked
CHECK_DEADLOCK FALSE
