  Grants <- vG
  Hidden = {}
  MaxBlind = 0
  Via = {}
  NoSync = {}
  Split = FALSE
  MaxRace = 99
  FirstAdm = {}
  Plain = {}
  Unaware = {}
  Ends = {}
  Walk = "rotator"
SPECIFICATION Spec
INVARIANTS NoLeakDirect NoLeakAbove
CHECK_DEADLOCK FALSE
