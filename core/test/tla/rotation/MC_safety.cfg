\* nobody offline, log order kept.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"m1"}
  Late = {}
  Remover = "a1"
  Departing = {"m1"}
  MaxE = 2
  Writes = 1
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Withhold = {}
  NoBoxCovers = FALSE
  GrantClaims = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked
CHECK_DEADLOCK FALSE
