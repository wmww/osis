\* Keyset names (crypto §4): reader g is a holder actor; its device d leaves
\* it (g's keyset to epoch 1). a1 reads g's new keyset, a2 never does
\* (withheld). a1's rotation boxing g at keyset 1 names it, so a2 never uses
\* that epoch, and a2's own rotations (boxing g at keyset 0, which d opens)
\* never carry it. 2 rotations, 1 write, log order.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 1
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = TRUE
  KeysetBy = "epoch"
  Frozen = TRUE
  Split = FALSE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "current"
  Proj = "none"
  GActs = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked DevLocked DevNoLeak
CHECK_DEADLOCK FALSE
