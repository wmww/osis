\* d's forgery lists keyset 1 but cannot sign under its delete key (d never
\* held its secret), so it descends from 0 only and no anchor at 1 admits it.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 0
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = FALSE
  KeysetBy = "epoch"
  Frozen = TRUE
  Split = FALSE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "grant"
  Proj = "none"
  GActs = {"forge", "snap"}
  Descent = TRUE
  Sigs = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked DevLocked
CHECK_DEADLOCK FALSE
