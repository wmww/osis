\* C3 under the study's rule with grants that leave g out refused. Expected
\* failure: DevGranted (a1 grants g at epoch 0 boxing it at 1, naming R_P; a2,
\* not having read the grant, rotates to e1 without g; then reads it: its box
\* is at a superseded epoch, so a2 re-seals g at e1 at keyset 0, e1's history
\* box carrying 0).
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {"g"}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 0
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = TRUE
  KeysetBy = "epoch"
  Frozen = TRUE
  Split = TRUE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "boxed"
  Proj = "none"
  GActs = {"fork"}
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DevGranted
CHECK_DEADLOCK FALSE
