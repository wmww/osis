\* 3-cycle (bActs), p admin of A and B lacks the grant A in C at first and seals B to C blind before it holds C's secret; Taint; no Box rule: the blind box taints B and is re-keyed; nothing leaks.
CONSTANTS
  ActSeq <- bActs
  Mem <- bMem
  Adm <- bAdm
  Learners <- bLearners
  Deps <- bDeps
  Eager = {}
  Forgers = {}
  WriteTo = {"A"}
  Writes = 1
  MaxE = 8
  Fresh = FALSE
  Grants <- bG
  Hidden <- bHide
  Taint = TRUE
  MaxBlind = 1
  Via = {}
  NoSync = {}
  Split = FALSE
  Merge = "fork"
  Alone = TRUE
  MaxRace = 99
  LeftOut = "wait"
  Rule = "spec"
SPECIFICATION Spec
INVARIANTS NoLeakKnownAll
PROPERTIES Excludes CurrentOpens ReadsAll Settles
CHECK_DEADLOCK FALSE
