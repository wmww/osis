\* C3 (study §2), box-inspection covers rule: g, not yet a holder of A, loses
\* d (R_P); a1 rotates e1 (nothing named about g: not below A); a1, holding
\* R_P, grants g at e1, boxing it at 1; a2 (never the roles part) reads the
\* grant, holds the ignorant fork 4 and rotates boxing g at 4 with e1 in the
\* history box. Expected failure: DevGranted.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {"g"}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 0
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = TRUE
  KeysetBy = "epoch"
  Frozen = FALSE
  Split = TRUE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "current"
  GActs = {"fork"}
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DevGranted
CHECK_DEADLOCK FALSE
