\* Negative control: as MC_grant, a grant carries no entry (claims from
\* rotation commits alone): the late grantee has no claim, never opens S,
\* never takes its grant (CurrentOpens).
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"m2"}
  Late = {"m2"}
  Remover = "a1"
  Departing = {}
  MaxE = 1
  Writes = 1
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Withhold = {}
  NoBoxCovers = FALSE
  GrantEntries = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked
PROPERTIES CurrentOpens
CHECK_DEADLOCK FALSE
