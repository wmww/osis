\* Negative control: MC_keyset without keyset names: a2 gets a roster
\* snapshot of g made after R_P (meeting the name of the departure from g),
\* establishes a1's epoch and puts it in the history box of its own rotation
\* boxing g at keyset 0 (expected failure: DevLocked).
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 1
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = FALSE
  GroupNames = TRUE
  KeysetBy = "epoch"
  Frozen = TRUE
  Split = FALSE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "current"
  Proj = "none"
  GActs = {"snap"}
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked DevLocked DevNoLeak
CHECK_DEADLOCK FALSE
