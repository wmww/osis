\* C3 under keyset descent: a1's grant of g anchors every later boxer of g
\* to keyset 1; a2, lacking R_P, holds the forgery and the fork but boxes g
\* only at a descendant of 1.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {"g"}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 0
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = FALSE
  KeysetBy = "epoch"
  Frozen = TRUE
  Split = TRUE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "grant"
  Proj = "none"
  GActs = {"forge", "fork"}
  Descent = TRUE
  Sigs = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DevGranted
CHECK_DEADLOCK FALSE
