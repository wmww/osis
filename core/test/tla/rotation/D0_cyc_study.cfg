\* 2-cycle X <-> Y: x1 removes D from X, y1 may rotate Y once unprompted. The study's cycle rule: a departure rotation leaves the other out, re-seal once its box back names the current keyset.
CONSTANTS
  ActSeq <- cActs
  Mem <- cMem
  Adm <- cAdm
  Learners <- cLearners
  Deps <- cDeps
  Eager <- cEager
  Forgers = {}
  WriteTo = {"X", "Y"}
  Writes = 2
  MaxE = 7
  LeaveOut = "direct"
  CycleCheck = "box"
  Stale = "listed"
  Anchor = TRUE
  Merge = TRUE
  Rejoin = FALSE
  Carry = TRUE
  Grants <- noGrants
  Hidden = {}
  Taint = FALSE
  MaxBlind = 0
SPECIFICATION Spec
INVARIANTS NoLeakDirect NoLeakMember NoLeakMemberAll
PROPERTIES Excludes CurrentOpens ReadsAll Settles
CHECK_DEADLOCK FALSE
