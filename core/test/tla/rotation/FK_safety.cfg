\* The digest rule: one honest rotation (the removal by A or W1, or none), W2 rotates once with any keyset and clock, 1 unprompted step; invariants (NoLeakStrict outside W2 masking).
CONSTANTS
  Rule = "digest"
  HMax = 1
  W2Max = 1
  MaxTs = 2
  OptSteps = 1
SPECIFICATION Spec
INVARIANTS NoSwallow NoLeak NoLeakStrict
CHECK_DEADLOCK FALSE
