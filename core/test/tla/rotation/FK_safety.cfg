\* The vouch rule: one honest rotation (the removal by A or W1, or none), W2 rotates once with any keyset and clock or rewrites a made epoch with a junk KEM key, 1 unprompted step; NoSwallow, NoLeak (NoLeakStrict fails by F2: A rotating over a keyset it cannot vouch for, unaware of the removal).
CONSTANTS
  Rule = "vouch"
  Parts = FALSE
  ReadOnly = FALSE
  HMax = 1
  W2Max = 1
  MaxTs = 2
  OptSteps = 1
SPECIFICATION Spec
INVARIANTS NoSwallow NoLeak
CHECK_DEADLOCK FALSE
