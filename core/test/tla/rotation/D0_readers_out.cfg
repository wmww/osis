\* G {R, A}, A {a1, M}, M {m1, R, E}: m1 removes E from M (alone or carried, Alone "any"); R, G's one admin, reads A only through M and may rotate neither. No write by a node knowing the removal and holding A's and M's epochs is under an epoch E opens (NoLeakAbove over chains). Walk "rotator" (main) fails; "out" and "wait" pass. Invariants, MaxE 7.
CONSTANTS
  ActSeq <- vActs
  Mem <- vMem
  Adm <- vAdm
  Learners <- vLearners
  Deps <- vDeps
  Eager = {}
  Forgers = {}
  WriteTo = {"G"}
  Writes = 1
  MaxE = 7
  Fresh = FALSE
  Grants <- vG
  Hidden = {}
  Taint = TRUE
  MaxBlind = 0
  Via = {}
  NoSync = {}
  Split = FALSE
  Merge = "fork"
  Alone = "any"
  MaxRace = 99
  LeftOut = "wait"
  Rule = "spec"
  Walk = "out"
SPECIFICATION Spec
INVARIANTS NoLeakDirect NoLeakAbove
CHECK_DEADLOCK FALSE
