\* Negative control: Rule "seen", honest only, read-only rotations, A may hold a keys.0 delta before its boxes; Healed fails (A steps naming the new keyset registering the old epoch, which stays in force once A holds the rotation whole).
CONSTANTS
  Rule = "seen"
  Parts = TRUE
  ReadOnly = TRUE
  HMax = 1
  W2Max = 0
  MaxTs = 2
  OptSteps = 0
SPECIFICATION LiveSpec
PROPERTY Healed
CHECK_DEADLOCK FALSE
