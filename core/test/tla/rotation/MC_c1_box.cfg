\* C1 (study §2), box-inspection covers rule: d leaves g; R_P reaches the
\* admins as two parts (Split), its roles.0 part never a2; a1, holding only
\* the keys.0 part, rotates e1 boxing g at 1, then learns the roles part and
\* writes under e1 (its box to g names 1: covers); an admin of g that has not
\* seen R_P forks g to 4 (boxing d); a2 establishes e1 and rotates boxing g at
\* 4 with e1 in the history box. Expected failure: DevNoLeak.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 1
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = TRUE
  KeysetBy = "epoch"
  Frozen = FALSE
  Split = TRUE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "current"
  GActs = {"fork"}
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DevLocked DevNoLeak
CHECK_DEADLOCK FALSE
