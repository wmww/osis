\* Negative control: as MC_withhold (no write) with each rotation naming
\* only itself (its own removal), not the removals its rotator held: a2,
\* withheld e2, holds e3, establishes it and re-seals m1 there (expected
\* failure: DepartedLocked).
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"m1"}
  Late = {}
  Remover = "a1"
  Departing = {"m1"}
  MaxE = 3
  Writes = 0
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {}
  Withhold = {"a2"}
  OwnNames = TRUE
  KeysetNames = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked
CHECK_DEADLOCK FALSE
