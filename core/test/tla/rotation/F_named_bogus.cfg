CONSTANTS
  Writers = {"A", "B", "X"}
  Readers = {"D1", "D2"}
  Finalizers = {"A", "X"}
  WithU2 = FALSE
  Keep = FALSE
  Bogus = TRUE
  Rule = "named"
  MaxE = 5
  MaxF = 3
SPECIFICATION Spec
INVARIANTS NoLeak Settles
CHECK_DEADLOCK FALSE
