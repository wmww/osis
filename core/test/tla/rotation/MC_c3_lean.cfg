\* As MC_c3 without g's ignorant fork (GActs empty): the smaller run.
\* C3 under frozen coverage, names tied to the grant: a node boxes g only
\* meeting the names of every grant of g it holds (a grant that would leave g
\* out is refused); a1's grant names R_P, so a2, not holding it, boxes g
\* nowhere.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {"g"}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 0
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = TRUE
  KeysetBy = "epoch"
  Frozen = TRUE
  Split = TRUE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "grant"
  Proj = "none"
  GActs = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DevGranted
CHECK_DEADLOCK FALSE
