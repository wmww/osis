\* As C_regrant with P demoted to read. Fails NoLeak, as expected: P's re-grant counts nowhere, so its
\* box opens for M until the role next rotates for another cause (spec/crypto.md §4 Boxes, Grant writes;
\* the accepted case: notes/keys-coverage.md, A demoted admin's void re-grant).
CONSTANTS
  Forge = {}
  Audit = FALSE
  Writers = {"O", "P"}
  MaxE = 2
  Regrant = TRUE
  DemoteTo = 1
  PKnows = {}
  Else = FALSE
  MetVoid = TRUE
  KeylessHolds = FALSE
  Dup = FALSE
SPECIFICATION Spec
INVARIANTS NoLeak
CHECK_DEADLOCK FALSE
