\* G {a1, A}, A {a1, a2, E}: a1 removes E from A alone (Alone "any"), so A's epochs miss it until a rotation; a2 may fork A, a1 may rotate G. No write by a node knowing the removal and holding A's epochs is under an epoch E opens (NoLeakAbove; G's epoch boxing A at an epoch missing the removal is blocked, and G's rotation leaves A out there). Invariants, MaxE 7.
CONSTANTS
  ActSeq <- uActs
  Mem <- uMem
  Adm <- uAdm
  Learners <- uLearners
  Deps <- uDeps
  Eager <- uEager
  Forgers = {}
  WriteTo = {"G"}
  Writes = 1
  MaxE = 7
  Fresh = FALSE
  Grants <- uG
  Hidden = {}
  Taint = TRUE
  MaxBlind = 0
  Via = {}
  NoSync = {}
  Split = FALSE
  Merge = "fork"
  Alone = "any"
  MaxRace = 99
  LeftOut = "wait"
  Rule = "spec"
SPECIFICATION Spec
INVARIANTS NoLeakDirect NoLeakAbove
CHECK_DEADLOCK FALSE
