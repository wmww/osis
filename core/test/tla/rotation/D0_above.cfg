\* G {a1, A}, A {a1, a2, E}: a1 removes E from A alone, so A's epochs miss it until a rotation; a2 may fork A, a1 may rotate G. No write by a node knowing the removal and holding A's epochs is under an epoch E opens (NoLeakAbove; G's epoch boxing A at an epoch missing the removal is blocked, and G's rotation leaves A out there). Invariants, MaxE 7.
CONSTANTS
  ActSeq <- uActs
  Mem <- uMem
  Adm <- uAdm
  Learners <- uLearners
  Deps <- uDeps
  Eager <- uEager
  Forgers = {}
  WriteTo = {"G"}
  Writes = 1
  MaxE = 7
  Grants <- uG
  Hidden = {}
  MaxBlind = 0
  Via = {}
  NoSync = {}
  Split = FALSE
  MaxRace = 99
  FirstAdm = {}
  Plain = {}
  Unaware = {}
  Walk = "rotator"
SPECIFICATION Spec
INVARIANTS NoLeakDirect NoLeakAbove
CHECK_DEADLOCK FALSE
