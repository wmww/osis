\* As MC_grant with a non-member planting one box (crypto §4): a grantee whose
\* grant raced a rotation has that epoch established without a valid box for
\* it; a planted secret must stay reading-only (NoPlantedKey). Invariants only:
\* planting changes no honest step, MC_grant checks the liveness.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"m2"}
  Late = {"m2"}
  Remover = "a1"
  Departing = {}
  MaxE = 1
  Writes = 1
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 1
  InOrder = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked NoPlantedKey
CHECK_DEADLOCK FALSE
