\* Keyset names with a forger: as MC_keyset, but d is an admin of g; after
\* leaving it (R_P, withheld from a2) d writes g a keyset listing every keyset
\* made as superseded, and a2 may get a roster snapshot of g made after R_P.
\* Rotations name the departure from g and the keyset. No write.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 0
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = TRUE
  KeysetBy = "epoch"
  Frozen = TRUE
  Split = FALSE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "current"
  Proj = "none"
  GActs = {"forge", "snap"}
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DepartedLocked DevLocked
CHECK_DEADLOCK FALSE
