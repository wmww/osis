\* A {a1, M}, M {m1, m2}; m1 and m2 rotate A through M (Via), keysets learned late (Late, the Carried limit): a merger supersedes a fork of A whose box to M it cannot open yet, and adds its secret to the history once the keyset arrives (HistAdd); every current holder ends holding every current epoch and rotations settle.
CONSTANTS
  ActSeq <- viActs
  Mem <- viMem
  Adm <- viAdm
  Learners <- viLearners
  Deps = {}
  Eager <- viEager
  Forgers = {}
  WriteTo = {"A"}
  Writes = 0
  MaxE = 6
  Grants <- viG
  Hidden = {}
  MaxBlind = 0
  Via <- viVia
  NoSync = {}
  Split = FALSE
  MaxRace = 99
  FirstAdm = {}
  Plain = {}
  Unaware = {}
  Walk = "rotator"
  Late <- fTrue
SPECIFICATION Spec
PROPERTIES CurrentOpens Settles
CHECK_DEADLOCK FALSE
