\* Negative control: Rule "seen" (the step names the keyset its issuer held, registering its newest held epoch); NoLeakStrict fails (W2 copies the knowing epoch to an A lacking it, A steps naming it and registering the old epoch).
CONSTANTS
  Rule = "seen"
  Parts = FALSE
  ReadOnly = FALSE
  HMax = 1
  W2Max = 1
  MaxTs = 2
  OptSteps = 1
SPECIFICATION Spec
INVARIANTS NoLeakStrict
CHECK_DEADLOCK FALSE
