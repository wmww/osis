\* C2 (notes/epoch-establishment-study.md §2), box-inspection covers rule:
\* a1 grants m2; a2 rotates e1 before reading the grant; a1 removes m2 (e2,
\* a fork of e1); a1 takes e1 (lower id), which holds no box for m2, and
\* writes under it; a2 reads the grant, completes its pass without e2 and
\* re-seals m2 at e1. Expected failure: NoLeak.
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"m2"}
  Late = {"m2"}
  Remover = "a1"
  Departing = {"m2"}
  MaxE = 2
  Writes = 1
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {}
  Withhold = {}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = TRUE
  KeysetBy = "epoch"
  Frozen = FALSE
  Split = FALSE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "current"
  Proj = "none"
  GActs = {}
  Descent = FALSE
  Sigs = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak
CHECK_DEADLOCK FALSE
