\* C3 under the study's rule (names of grant and re-seal boxes to g at a
\* current epoch the boxer holds), grants may leave g out. Expected failure:
\* DevGranted (a1 knows R_P but not a covering keyset of g: its grant boxes
\* nothing, so no box carries its names; a2 re-seals g at keyset 0).
CONSTANTS
  Admins = {"a1", "a2"}
  Readers = {"g"}
  Late = {"g"}
  Remover = "a1"
  Departing = {}
  MaxE = 2
  Writes = 0
  DropClaims = FALSE
  Refresh = FALSE
  Offs = 0
  Plants = 0
  InOrder = TRUE
  Groups = {"g"}
  Withhold = {"a2"}
  OwnNames = FALSE
  KeysetNames = TRUE
  GroupNames = TRUE
  KeysetBy = "epoch"
  Frozen = TRUE
  Split = TRUE
  GrantNames = TRUE
  NoBoxCovers = FALSE
  GNamesBy = "current"
  Proj = "none"
  GActs = {"fork"}
  Descent = FALSE
  Sigs = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLeak DevGranted
CHECK_DEADLOCK FALSE
