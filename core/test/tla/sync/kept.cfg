  Snaps = {"s"}
  DepositC = {}
  Author <- K_Author
  Deps <- K_Deps
  CD <- K_CD
  Kills <- K_Empty
  Covers <- K_Covers
  Purges <- K_Empty
  Exp <- K_None
  KeepUntil <- K_Until
  KeepAfter <- K_Zero
  NoneC = {}
