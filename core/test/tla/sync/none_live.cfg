\* Scenario L: as N, but c1 = {d1, e1} and c2 kills only d1, so e1 stays
\* live: the covers carry it (and are `none` themselves). One encryption per
\* body (Vs = {0}) to keep the run short.
CONSTANTS
  Nodes = {"w1", "w2"}
  Writers = {"w1", "w2"}
  Commits <- N_Commits
  Snaps = {"s1", "s2"}
  DepositC = {}
  Author <- N_Author
  Deps <- N_Deps
  CD <- L_CD
  Kills <- N_Kills
  Covers <- L_Covers
  Purges <- N_Purges
  Exp <- N_None
  KeepUntil <- N_Zero
  KeepAfter <- N_Zero
  NoneC = {"c1", "s1", "s2"}
  MaxT = 1
  Vs = {0}
  Budget = 1
  AdvDrops = 0
  AdvReplays = 0
  Offs = 0
  PurgeKeep = 1
  Inf = 99
SPECIFICATION Spec
INVARIANTS TypeOK NoLiveLoss LiveKept StateCarried KeptUntil
PROPERTIES Converge Clean Quiesce NoneCovered
CHECK_DEADLOCK FALSE
