\* Scenario N: history `none`: c2 kills d1 of c1; each writer holding c1
\* owes a covering snapshot (s1, s2); c1 goes as covered everywhere; two
\* writers, time 0..1.
CONSTANTS
  Nodes = {"w1", "w2"}
  Writers = {"w1", "w2"}
  Commits <- N_Commits
  Snaps = {"s1", "s2"}
  DepositC = {}
  Author <- N_Author
  Deps <- N_Deps
  CD <- N_CD
  Kills <- N_Kills
  Covers <- N_Covers
  Purges <- N_Purges
  Exp <- N_None
  KeepUntil <- N_Zero
  NoneC = {"c1"}
  MaxT = 1
  Vs = {0, 1}
  Budget = 1
  AdvDrops = 0
  AdvReplays = 0
  Offs = 0
  PurgeKeep = 1
  Inf = 99
SPECIFICATION Spec
INVARIANTS TypeOK NoLiveLoss LiveKept StateCarried KeptUntil
PROPERTIES Converge Clean Quiesce NoneCovered
CHECK_DEADLOCK FALSE
