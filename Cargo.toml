[workspace]
resolver = "2"
members = ["core/*", "libs/chat", "core/test/sim", "core/test/crdt-model", "core/test/roles-model", "core/test/held-model", "core/test/vectors", "cli", "libs/kit", "app", "app/android"]
# Core: what a bare `cargo build`/`test`/`clippy` selects. The GUI (libs/kit, app, app/android;
# notes/app.md) builds only when named (`-p`, `--workspace`), sharing core's artifacts (notes/build.md).
default-members = ["core/*", "libs/chat", "core/test/sim", "core/test/crdt-model", "core/test/roles-model", "core/test/held-model", "core/test/vectors", "cli"]
# libs/kit/patches: vendored crates, reached through [patch] only
exclude = ["core/test", "libs/kit/patches"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"  # slice::as_chunks
license = "MIT"

# Every external dependency needs its line in notes/architecture.md (Dependency policy).
[workspace.dependencies]
osis-base = { path = "core/base" }
osis-crypto = { path = "core/crypto" }
osis-crdt = { path = "core/crdt" }
osis-perm = { path = "core/perm" }
osis-schema = { path = "core/schema" }
osis-store = { path = "core/store" }
osis-commit = { path = "core/commit" }
osis-keys = { path = "core/keys" }
osis-label = { path = "core/label" }
osis-proto = { path = "core/proto" }
osis-transport = { path = "core/transport" }
osis-host = { path = "core/host" }
osis-engine = { path = "core/engine" }
osis-node = { path = "core/node" }
osis = { path = "core/osis" }
osis-chat = { path = "libs/chat" }
osis-kit = { path = "libs/kit" }
osis-app = { path = "app" }
osis-sim = { path = "core/test/sim" }
crdt-model = { path = "core/test/crdt-model" }
held-model = { path = "core/test/held-model" }
osis-vectors = { path = "core/test/vectors" }
roles-model = { path = "core/test/roles-model" }
blake3 = { version = "1.8", default-features = false, features = ["std", "zeroize"] }
proptest = { version = "1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize", "fast", "hazmat", "digest"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["zeroize", "precomputed-tables"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem768"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
chacha20 = { version = "0.9", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.8", features = ["std", "zeroize_derive"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
subtle = { version = "2.6", default-features = false }
redb = { version = "2.6", default-features = false }
tokio = { version = "1.53", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "env"] }
anyhow = "1.0"
# The GUI. One pinned Masonry (notes/app.md Toolkit); re-exported as osis_kit::masonry.
masonry = "=0.4.0"
masonry_winit = "=0.4.0"
# Civil time and the system time zone for calendar views (notes/architecture.md).
jiff = "0.2"
# Feature pins only (notes/build.md, Feature unification): default features, as quinn-proto and
# libcrux-platform enable them.
rand = "0.10"
libc = "0.2"
# As the GUI stack enables them: bitflags (wgpu-types), num-traits (half under naga), tracing and
# tracing-core with defaults (masonry); in core they come in through proptest and quinn.
bitflags = { version = "2.13", features = ["serde", "std"] }
num-traits = { version = "0.2", features = ["libm"] }
tracing = "0.1"
tracing-core = "0.1"
# The reverse, for the GUI: proptest's default features (regex-syntax under tracing-subscriber).
regex-syntax = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
# cargo-fuzz builds with `--cfg fuzzing` (core/test/fuzz)
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# No panics on data (notes/architecture.md §3). Tests are exempt via clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Every test run and sim sweep uses this profile (notes/testing.md, Build hygiene). opt-level 1:
# tests several times faster for slower compiles; line tables keep backtraces' file:line, and
# unpacked split debuginfo keeps the rest beside the objects instead of in every test binary.
[profile.dev]
debug = "line-tables-only"
opt-level = 1
lto = "off"

# Dependencies only: crypto and hashing unoptimized are slow; no debuginfo (frames in
# dependencies show no file:line).
[profile.dev.package."*"]
opt-level = 2
debug = false

# osis-crypto instantiates the generic AEAD, hash and curve code: optimized like a dependency.
[profile.dev.package.osis-crypto]
opt-level = 2

[profile.release]
codegen-units = 16
lto = "thin"

# Patched low-level crates of the GUI stack, vendored in libs/kit/patches/ (notes/app.md, Patches).
[patch.crates-io]
masonry = { path = "libs/kit/patches/masonry" }
masonry_core = { path = "libs/kit/patches/masonry_core" }
masonry_winit = { path = "libs/kit/patches/masonry_winit" }
