[workspace]
resolver = "2"
members = ["crates/*", "models/crdt", "models/membership", "vectors", "sim"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"  # slice::as_chunks
license = "MIT"

# Every external dependency needs its line in notes/architecture.md (Dependency policy).
[workspace.dependencies]
osis-core = { path = "crates/osis-core" }
osis-crypto = { path = "crates/osis-crypto" }
osis-crdt = { path = "crates/osis-crdt" }
osis-perm = { path = "crates/osis-perm" }
osis-schema = { path = "crates/osis-schema" }
osis-store = { path = "crates/osis-store" }
osis-commit = { path = "crates/osis-commit" }
osis-keys = { path = "crates/osis-keys" }
osis-label = { path = "crates/osis-label" }
osis-proto = { path = "crates/osis-proto" }
osis-transport = { path = "crates/osis-transport" }
osis-server = { path = "crates/osis-server" }
osis-node = { path = "crates/osis-node" }
osis = { path = "crates/osis" }
osis-sim = { path = "sim" }
crdt-model = { path = "models/crdt" }
membership-model = { path = "models/membership" }
blake3 = { version = "1.8", default-features = false, features = ["std"] }
proptest = { version = "1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize", "fast"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["zeroize", "precomputed-tables"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem768"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = { version = "1.8", default-features = false, features = ["std"] }
rand_core = { version = "0.6", default-features = false }
subtle = { version = "2.6", default-features = false }
redb = { version = "2.6", default-features = false }
tokio = { version = "1.53", default-features = false }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "env"] }
anyhow = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# No panics on data (notes/architecture.md §3). Tests are exempt via clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Tier 1, tier 2 and sweeps all run this profile (notes/testing.md, Build hygiene). opt-level 1:
# tests several times faster for slower compiles; line tables keep backtraces' file:line, and
# unpacked split debuginfo keeps the rest beside the objects instead of in every test binary.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

# Dependencies only: crypto and hashing unoptimized are slow; no debuginfo (frames in
# dependencies show no file:line).
[profile.dev.package."*"]
opt-level = 2
debug = false

# osis-crypto instantiates the generic AEAD, hash and curve code: optimized like a dependency.
[profile.dev.package.osis-crypto]
opt-level = 2

[profile.release]
codegen-units = 16
lto = "thin"
