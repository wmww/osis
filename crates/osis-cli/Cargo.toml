[package]
name = "osis-cli"
description = "Command-line tool osis over the API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "osis"
path = "src/main.rs"

[dependencies]
osis = { workspace = true, features = ["file-store", "quic"] }
osis-schema.workspace = true
osis-server = { workspace = true, features = ["bin"] }
clap.workspace = true
anyhow.workspace = true

[dev-dependencies]
proptest.workspace = true
