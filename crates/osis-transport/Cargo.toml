[package]
name = "osis-transport"
description = "Transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
osis-core.workspace = true
zeroize.workspace = true
# InProcess keys are Ed25519 like every transport's (a dialable key verifies LAN announcements).
ed25519-dalek.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
ring = { version = "0.17", optional = true }
tokio = { workspace = true, features = ["rt", "net", "sync", "time"], optional = true }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"], optional = true }
# iroh's own network monitor (already in its tree): network changes for the LAN loop.
netwatch = { version = "0.19", optional = true }
# An IPv6-only LAN socket beside the IPv4 one (already in tokio's tree).
socket2 = { version = "0.6", optional = true }
# Only for tier-2 relay tests (feature `relay`): a self-hosted relay on localhost.
iroh-relay = { version = "1.3", default-features = false, features = ["server", "tls-ring"], optional = true }

[features]
quic = ["dep:quinn", "dep:rustls", "dep:ring", "dep:tokio"]
# Sessions as channel pairs with tokio pump tasks, for node and server drivers.
link = ["dep:tokio"]
# P2P by dialable key (notes/networking.md): iroh endpoints, relays, hole punching.
iroh = ["dep:iroh", "dep:tokio", "dep:netwatch"]
# LAN announcements over UDP, IPv4 and IPv6 (spec/sync.md §10); with `iroh`, network changes
# from netwatch.
lan = ["dep:tokio", "dep:socket2"]
# `iroh::TestRelay`: a self-hosted iroh-relay on localhost for tier-2 tests.
relay = ["iroh", "dep:iroh-relay"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
